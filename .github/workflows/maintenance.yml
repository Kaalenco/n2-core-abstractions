# Maintenance workflow
#
# Runs weekly to:
#   1. Delete old workflow runs:
#        - Failed runs older than 10 days
#        - All codeql.yml runs older than 10 days
#   2. Unlist old NuGet package versions (keeps the 5 most recent).
#      NuGet does not support deletion; unlisted packages are hidden from search
#      but remain downloadable for existing consumers.
#
# Required secrets / variables:
#   GH_MAINTENANCE      Fine-grained PAT with Actions: Read+Write on this repo
#   PACKAGE_N2          NuGet API key — must have "Unlist package" scope as well
#                       as the usual push scope (edit the key on nuget.org if needed)
#   NUGET_PACKAGE_ID    Repository variable, e.g. "N2.Core.Abstractions"

name: Maintenance

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 03:00 UTC
  workflow_dispatch:        # allow manual trigger from the GitHub UI

jobs:
  # ── Cleanup Old Workflow Runs ────────────────────────────────────────────────
  cleanup-workflow-runs:
    name: Delete Old Workflow Runs
    runs-on: ubuntu-latest
    # Hoist secrets to job level so every step can access them without
    # repeating env blocks. GH_MAINTENANCE is a repository secret.
    # GH_TOKEN is set to the same PAT (not the auto-provided GITHUB_TOKEN):
    # GITHUB_TOKEN cannot delete runs created by other workflows and returns
    # 403; the PAT acts as a user-level credential and can delete any run.
    env:
      GH_MAINTENANCE: ${{ secrets.GH_MAINTENANCE }}
      GH_TOKEN: ${{ secrets.GH_MAINTENANCE }}
      REPO: ${{ github.repository }}

    steps:
    - uses: actions/checkout@v6

    - name: Verify workflow parameters
      run: bash scripts/verify-workflow-params.sh GH_MAINTENANCE RETENTION_DAYS=10

    - name: Delete old workflow runs
      run: bash scripts/delete-workflow-runs.sh

  # ── Unlist Old NuGet Package Versions ───────────────────────────────────────
  unlist-old-nuget-versions:
    name: Unlist Old NuGet Versions
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGE_ID: ${{ vars.NUGET_PACKAGE_ID }}
      PACKAGE_N2: ${{ secrets.PACKAGE_N2 }}
      KEEP_VERSIONS: 5

    steps:
    - uses: actions/checkout@v6

    - name: Verify workflow parameters
      run: bash scripts/verify-workflow-params.sh NUGET_PACKAGE_ID PACKAGE_N2 KEEP_VERSIONS=5

    - name: Unlist old NuGet versions
      run: bash scripts/unlist-old-nuget-versions.sh
